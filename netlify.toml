[build]
  command = "node scripts/build-public.js"
  publish = "dist"

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/cookie-policy"
  to = "/cookie-policy.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/file-retention"
  to = "/file-retention.html"
  status = 200

[[redirects]]
  from = "/security"
  to = "/file-retention"
  status = 301
  force = true

[[redirects]]
  from = "/troubleshooting"
  to = "/troubleshooting.html"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Every tool has its own static page (tools/<slug>.html, built by scripts/build-public.js), so no SPA rewrite is needed.
[[redirects]]
  from = "/tools"
  to = "/#all-tools"
  status = 301
  force = true

[[redirects]]
  from = "/tool/:slug"
  to = "/tools/:slug"
  status = 301
  force = true

